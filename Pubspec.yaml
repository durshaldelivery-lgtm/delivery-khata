name: delivery_khata
description: "Delivery Khata - Orders, Expenses, Udhar Tracker"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management (Required for BlocBuilder, context.watch, context.read)
  flutter_bloc: ^8.1.6
  provider: ^6.1.2

  # UI & Icons
  cupertino_icons: ^1.0.8

  # Date & Formatting
  intl: ^0.19.0

  # Invoice Sharing & Image Export
  screenshot: ^3.0.0
  share_plus: ^10.0.0
  gal: ^2.3.0
  path_provider: ^2.1.4

  # Firebase
  firebase_core: ^3.3.0
  cloud_firestore: ^5.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
