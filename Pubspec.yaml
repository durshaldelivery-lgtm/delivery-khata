name: delivery_khata
description: "Delivery Khata - Orders, Expenses, Udhar Tracker"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management & Persistence
  flutter_bloc: ^8.1.6
  hydrated_bloc: ^9.1.5
  provider: ^6.1.2

  # File system paths
  path_provider: ^2.1.4

  # Contacts
  flutter_contacts: ^1.1.9+2

  # UI & Icons
  cupertino_icons: ^1.0.8

  # Date & Formatting
  intl: ^0.19.0

  # Invoice Sharing, Image Export & External Apps
  screenshot: ^3.0.0
  share_plus: ^10.0.0
  gal: ^2.3.0
  url_launcher: ^6.3.0

  # Firebase
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
